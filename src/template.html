<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="herm-template-version" content="8" />
    <title>HERM BRM __V__</title>
    <style>
      /* Palette: NTNU graphic profile. Each stream sets --hd (header), --l1 (L1 box), --bd (border). */
      :root {
        --bg: #fff;
        --fg: #282d37;
        --mut: #505862;
        --ac: #00509e;
        --l2: #fff;
        --hit: #fdd9b5;
        --hitbd: #ef8114;
        --red: #d32f2f;
        --sel: #fdf0c4;
        --hd: #00509e;
        --l1: #cfdaf1;
        --bd: #9db7e1;
        --a: 14px;
      }
      .s-lt {
        --hd: #00509e;
        --l1: #cfdaf1;
        --bd: #9db7e1;
      }
      .s-res {
        --hd: #2e7578;
        --l1: #d1eaeb;
        --bd: #97d2d4;
      }
      .s-ena {
        --hd: #7d705a;
        --l1: #eee5d5;
        --bd: #e0d0af;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161b26;
          --fg: #e6e9f0;
          --mut: #c3cada;
          --ac: #9dbdec;
          --l2: #1d2638;
          --hit: #5a3a14;
          --hitbd: #f4ac67;
          --red: #ff6b6b;
          --sel: #5a4a14;
        }
        .s-lt {
          --hd: #3e628a;
          --l1: #253a55;
          --bd: #3e628a;
        }
        .s-res {
          --hd: #2e7578;
          --l1: #1f3a3c;
          --bd: #2e7578;
        }
        .s-ena {
          --hd: #7d705a;
          --l1: #3d3732;
          --bd: #7d705a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font:
          13px/1.35 system-ui,
          sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 15;
        background: var(--bg);
        padding: 8px 14px;
        border-bottom: 1px solid #9db7e1;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      h1 {
        font-size: 16px;
        margin: 0 8px 0 0;
      }
      button,
      input {
        font: inherit;
        padding: 3px 9px;
        border: 1px solid #9db7e1;
        background: var(--l2);
        color: var(--fg);
        border-radius: 4px;
      }
      button.on {
        background: #00509e;
        color: #fff;
      }
      .legend {
        color: var(--mut);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 14px;
        height: 14px;
        border: 2px solid var(--red);
        border-radius: 3px;
      }
      main {
        padding: 14px;
      }
      .ic {
        display: inline-block;
        min-width: 1.15em;
        text-align: center;
        font-style: normal;
      }
      .lic {
        text-align: center;
        font-size: 11px;
        color: var(--mut);
        padding: 8px 14px 18px;
      }
      .lic:empty {
        display: none;
      }
      h2 {
        font-size: 16px;
        margin: 18px 0 6px;
      }
      .box {
        border: 1px solid var(--bd);
        border-radius: 4px;
        padding: 6px;
        margin-bottom: 12px;
        width: 100%;
      }
      .chain {
        display: grid;
        gap: 6px;
      }
      /* block arrows: flow of the value stream */
      .ph {
        background: var(--hd);
        color: #fff;
        text-align: center;
        font-weight: 600;
        padding: 8px calc(var(--a) + 6px);
        margin-right: calc(var(--a) * -0.6);
        min-width: 0;
        clip-path: polygon(
          0 0,
          calc(100% - var(--a)) 0,
          100% 50%,
          calc(100% - var(--a)) 100%,
          0 100%,
          var(--a) 50%
        );
      }
      .ph.first {
        padding-left: 10px;
        clip-path: polygon(
          0 0,
          calc(100% - var(--a)) 0,
          100% 50%,
          calc(100% - var(--a)) 100%,
          0 100%
        );
      }
      .ph .sec {
        color: #fff;
      }
      .l1 {
        background: var(--l1);
        border: 1px solid var(--bd);
        border-radius: 3px;
        padding: 5px;
        min-width: 0;
      }
      .l1 > .t {
        font-weight: 600;
        font-size: 12.5px;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .kids {
        display: grid;
        gap: 4px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr));
      }
      .l2 {
        background: var(--l2);
        border: 1px solid var(--bd);
        border-radius: 2px;
        padding: 3px 4px;
        cursor: pointer;
        font-size: 11.5px;
        min-width: 0;
      }
      .l1,
      .l2,
      .ph,
      li {
        overflow-wrap: break-word;
        hyphens: auto;
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .wrap .l1 {
        flex: 1 1 320px;
      }
      .code {
        color: var(--mut);
        font-size: 10px;
        display: block;
      }
      .sec {
        color: var(--mut);
        display: block;
        font-size: 11px;
        font-weight: 400;
      }
      .miss {
        font-style: italic;
      }
      .missing {
        border-color: var(--red) !important;
        box-shadow: inset 0 0 0 1px var(--red);
      }
      li.missing {
        border: 1px solid var(--red);
        border-radius: 3px;
        padding: 0 4px;
      }
      .bar {
        flex-basis: 100%;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        border-top: 1px solid #9db7e1;
        padding-top: 6px;
      }
      .bar select {
        max-width: 260px;
        font: inherit;
        padding: 3px;
        background: var(--l2);
        color: var(--fg);
        border: 1px solid #9db7e1;
        border-radius: 4px;
      }
      .st {
        color: var(--mut);
      }
      .st b {
        color: var(--red);
      }
      .warn {
        background: #fdd9b5;
        color: #282d37;
        padding: 4px 10px;
        border-radius: 4px;
        flex-basis: 100%;
      }
      .pri {
        background: #00509e !important;
        color: #fff !important;
      }
      .danger {
        border-color: var(--red) !important;
        color: var(--red);
      }
      .cb {
        position: absolute;
        top: 2px;
        right: 2px;
        margin: 0;
        cursor: pointer;
      }
      .l1 > .t .cb {
        position: static;
        float: right;
        margin: 1px 0 0 4px;
      }
      .l2 {
        position: relative;
        padding-right: 18px;
      }
      li .cb {
        margin-right: 6px;
        vertical-align: middle;
      }
      .sel {
        background: var(--sel) !important;
      }
      li.sel {
        border-radius: 3px;
      }
      dialog {
        border: 1px solid #9db7e1;
        border-radius: 6px;
        padding: 16px 18px;
        max-width: 480px;
        width: calc(100% - 32px);
        background: var(--bg);
        color: var(--fg);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      dialog h3 {
        margin: 0 0 8px;
      }
      dialog input {
        width: 100%;
        margin: 6px 0 10px;
      }
      .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .dim {
        color: var(--mut);
      }
      .dim:not(.sel) {
        background: transparent !important;
      }
      .part > .t {
        color: var(--mut);
      }
      ::placeholder {
        color: var(--mut);
        opacity: 1;
      }
      .hit {
        outline: 2px solid var(--hitbd);
        background: var(--hit) !important;
      }
      details {
        margin-left: 16px;
      }
      summary {
        cursor: pointer;
      }
      button,
      select,
      summary,
      input[type="checkbox"],
      .cb,
      .l2,
      .l1 > .t,
      li[data-c] {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      .help {
        position: relative;
      }
      #ub {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .help > summary {
        list-style: none;
        padding: 3px 9px;
        border: 1px solid #9db7e1;
        border-radius: 4px;
        background: var(--l2);
        user-select: none;
      }
      .help > summary::-webkit-details-marker {
        display: none;
      }
      .help[open] > summary {
        background: #00509e;
        color: #fff;
      }
      .hb {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        width: min(620px, 92vw);
        max-height: 70vh;
        overflow: auto;
        background: var(--bg);
        border: 1px solid #9db7e1;
        border-radius: 6px;
        padding: 4px 16px 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        z-index: 20;
        line-height: 1.45;
      }
      .hb h4 {
        margin: 14px 0 4px;
        color: var(--ac);
      }
      .hb p {
        margin: 4px 0;
      }
      .hb ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      .hb li {
        list-style: disc;
        margin: 3px 0;
      }
      li {
        list-style: none;
        margin: 1px 0;
      }
      #d {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        border-top: 2px solid #00509e;
        padding: 10px 14px;
        display: none;
        max-height: 45vh;
        overflow: auto;
        z-index: 9;
      }
      #d .c {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      #d h3 {
        margin: 2px 0;
      }
      #d small,
      #d .sec {
        color: var(--mut);
      }
      /* narrow screens: phases stack top to bottom with down-pointing arrows */
      @media (max-width: 1000px) {
        .chain {
          grid-template-columns: minmax(0, 1fr) !important;
        }
        .chain > * {
          grid-column: 1/-1 !important;
          grid-row: auto !important;
        }
        .ph,
        .ph.first {
          margin: 0 0 -4px;
          padding: 8px 10px calc(var(--a) + 4px);
          clip-path: polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--a)),
            50% 100%,
            0 calc(100% - var(--a))
          );
        }
        #d .c {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>HERM __V__ BRM</h1>
      <span id="lb"></span><span id="vb"></span><input id="q" /><span
        class="legend"
        ><i></i><span id="mc"></span
      ></span>
      <span id="ub"></span>
      <details class="help" id="help" hidden>
        <summary id="hs"></summary>
        <div class="hb" id="hb"></div>
      </details>
      <div class="bar" id="bar"></div>
    </header>
    <main id="m"></main>
    <footer class="lic" id="lic"></footer>
    <div id="d"></div>
    <dialog id="dg"></dialog>
    <input
      type="file"
      id="fi"
      accept=".json,application/json"
      hidden
      onchange="impFile(this)"
    />
    <script>
      __JSPDF__;
    </script>
    <script>
      const M = __DATA__,
        [P, S] = M.langs,
        st = { lang: "both", ui: "EN", view: "diagram" }; // lang = content language (both/en/no); ui = interface language (EN/NO), independent. NB: not a global "lang": inline handlers resolve names on the element first
      const cnt = {
          NO: (n) => `${n} kapabilitet${n == 1 ? "" : "er"}`,
          EN: (n) => `${n} ${n == 1 ? "capability" : "capabilities"}`,
        },
        cntSel = {
          NO: (n) =>
            `${n} ${n == 1 ? "valgt kapabilitet" : "valgte kapabiliteter"}`,
          EN: (n) => `${n} selected ${n == 1 ? "capability" : "capabilities"}`,
        };
      const UI = {
        NO: {
          level: "Nivå",
          parent: "overordnet",
          textMissing: (L) => `[${L} tekst mangler]`,
          missShort: (L) => `${L} mangler`,
          core: "Kjerne",
          enabling: "Muliggjørende",
          savedList: "Lagrede utvalg",
          contentLang: "Innholdsspråk",
          uiLang: "Grensesnittspråk",
          tipBoth: "Vis begge språk",
          tipEn: "Vis engelsk",
          tipNo: "Vis norsk",
          search: "Søk kode / navn…",
          missing: "mangler oversettelse",
          diagram: "Diagram",
          tree: "Tre",
          close: "Lukk",
          sel: "valgt",
          select: "Velg",
          deselect: "Fjern valg",
          newOpt: "Nytt utvalg (ulagret)",
          save: "Lagre",
          saveAs: "Lagre som…",
          fresh: "Nytt utvalg",
          del: "Slett / tøm",
          json: "Eksporter JSON",
          pdf: "Eksporter PDF",
          imp: "Importer JSON",
          unsaved: "ulagrede endringer",
          saved: "lagret",
          dlgName: "Navn på utvalget",
          defName: (n) => `Utvalg ${n}`,
          cancel: "Avbryt",
          warnTitle: "Lagre før du fortsetter?",
          warn: (n, c) =>
            `Du har ulagrede endringer i «${n}» (${cnt.NO(
              c,
            )}). Fortsetter du uten å lagre, går de tapt.`,
          warnNoStore: (n, c) =>
            `Du har ulagrede endringer i «${n}» (${cnt.NO(
              c,
            )}), og nettleseren tillater ikke lagring. Eksporter JSON først hvis du vil beholde dem.`,
          saveGo: "Lagre og fortsett",
          discard: "Forkast og fortsett",
          clearTitle: "Tømme utvalget?",
          clearMsg: (n) =>
            `${cntSel.NO(
              n,
            )} fjernes fra utvalget. Utvalget er ikke lagret, så dette kan ikke angres.`,
          savedTitle: (n) => `Tømme eller slette «${n}»?`,
          savedMsg: (n, c) =>
            c
              ? `«${n}» har ${cntSel.NO(
                  c,
                )}. «Tøm utvalget» fjerner valgene, men beholder lagringen til du lagrer på nytt. «Slett lagret utvalg» fjerner lagringen fra denne nettleseren og tømmer utvalget. Ingen av delene kan angres.`
              : `«${n}» slettes fra denne nettleseren. Det kan ikke angres.`,
          clearBtn: "Tøm utvalget",
          delBtn: "Slett lagret utvalg",
          noStore:
            "Nettleseren tillater ikke lagring (privat modus?). Du kan fortsatt eksportere utvalget.",
          badFile: "Filen er ikke et gyldig utvalg.",
          unknown: (n) =>
            `${n} ${
              n == 1 ? "ukjent kode ble" : "ukjente koder ble"
            } hoppet over.`,
          pdfTitle: "Valgte kapabiliteter",
          pdfCount: (n) => cnt.NO(n),
          noPdf: "PDF-biblioteket er ikke lastet.",
          untitled: "Utvalg",
        },
        EN: {
          level: "Level",
          parent: "parent",
          textMissing: (L) => `[${L} text missing]`,
          missShort: (L) => `${L} missing`,
          core: "Core",
          enabling: "Enabling",
          savedList: "Saved selections",
          contentLang: "Content language",
          uiLang: "Interface language",
          tipBoth: "Show both languages",
          tipEn: "Show English",
          tipNo: "Show Norwegian",
          search: "Search code / name…",
          missing: "missing translation",
          diagram: "Diagram",
          tree: "Tree",
          close: "Close",
          sel: "selected",
          select: "Select",
          deselect: "Deselect",
          newOpt: "New selection (unsaved)",
          save: "Save",
          saveAs: "Save as…",
          fresh: "New selection",
          del: "Delete / clear",
          json: "Export JSON",
          pdf: "Export PDF",
          imp: "Import JSON",
          unsaved: "unsaved changes",
          saved: "saved",
          dlgName: "Name of the selection",
          defName: (n) => `Selection ${n}`,
          cancel: "Cancel",
          warnTitle: "Save before continuing?",
          warn: (n, c) =>
            `You have unsaved changes in "${n}" (${cnt.EN(
              c,
            )}). If you continue without saving they will be lost.`,
          warnNoStore: (n, c) =>
            `You have unsaved changes in "${n}" (${cnt.EN(
              c,
            )}), and the browser does not allow saving. Export JSON first if you want to keep them.`,
          saveGo: "Save and continue",
          discard: "Discard and continue",
          clearTitle: "Clear the selection?",
          clearMsg: (n) =>
            `${cntSel.EN(
              n,
            )} will be removed from the selection. It is not saved, so this cannot be undone.`,
          savedTitle: (n) => `Clear or delete "${n}"?`,
          savedMsg: (n, c) =>
            c
              ? `"${n}" has ${cntSel.EN(
                  c,
                )}. "Clear selection" removes the ticks but keeps the save until you save again. "Delete saved selection" removes the save from this browser and clears the selection. Neither can be undone.`
              : `"${n}" will be deleted from this browser. This cannot be undone.`,
          clearBtn: "Clear selection",
          delBtn: "Delete saved selection",
          noStore:
            "The browser does not allow saving (private mode?). You can still export the selection.",
          badFile: "The file is not a valid selection.",
          unknown: (n) =>
            `${n} unknown ${n == 1 ? "code was" : "codes were"} skipped.`,
          pdfTitle: "Selected capabilities",
          pdfCount: (n) => cnt.EN(n),
          noPdf: "The PDF library is not loaded.",
          untitled: "Selection",
        },
      };
      // Interface language is chosen independently of the content language (st.lang).
      let T = UI.EN;
      const uiLang = () => st.ui,
        order = () =>
          st.lang == "no"
            ? ["NO", "EN"]
            : st.lang == "en"
              ? ["EN", "NO"]
              : M.langs, // content order for the detail panel and the PDF export
        setT = () => {
          T = UI[uiLang()];
          document.documentElement.lang = uiLang() == "NO" ? "nb" : "en";
        },
        lg = (L) => (L == "NO" ? "nb" : "en");
      // Icons are decorative (aria-hidden); the text label carries the meaning.
      const IC = {
          lang: "🌐",
          ui: "🖥️",
          diagram: "🗺️",
          tree: "🌳",
          help: "ℹ️",
          saves: "📁",
          save: "💾",
          saveAs: "📑",
          fresh: "➕",
          del: "🗑️",
          imp: "📥",
          json: "📤",
          pdf: "📄",
          close: "✖",
          select: "☑️",
          deselect: "⬜",
          saveGo: "💾",
          discard: "🚫",
          cancel: "↩️",
          clearBtn: "🧹",
          delBtn: "🗑️",
          ok: "✔",
        },
        ic_ = (g) => `<span class=ic aria-hidden="true">${g}</span>`,
        ic = (k) => ic_(IC[k]),
        ib = (k) => `${ic(k)} ${T[k]}`;
      const h = (s) =>
        String(s).replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );
      const idx = {};
      (function w(o) {
        if (o.code) idx[o.code] = o;
        ["caps", "kids", "segments", "chains", "domains"].forEach((k) =>
          (o[k] || []).forEach(w),
        );
      })({ domains: M.domains });
      const nm = (o, L) => (L == "NO" ? o.no : o.en),
        ds = (o, L) => (L == "NO" ? o.no_desc : o.en_desc);
      const miss = (o) =>
        !!o.code && ["NO", "EN"].some((L) => !nm(o, L) || !ds(o, L)); // a missing name or description in either language
      const sc = (n) =>
        n == "Research" ? "res" : n == "Enabling" ? "ena" : "lt";
      function lab(o, c) {
        const O = (L) => (L == "NO" ? "EN" : "NO"),
          mk = (L, pri) =>
            nm(o, L)
              ? pri
                ? `<b lang=${lg(L)}>${h(nm(o, L))}</b>`
                : `<span class=sec lang=${lg(L)}>${h(nm(o, L))}</span>`
              : pri
                ? `<b class=miss lang=${lg(O(L))}>${h(nm(o, O(L)))}</b>`
                : `<span class=sec><i>(${T.missShort(L)})</i></span>`;
        const body =
          st.lang == "en"
            ? mk("EN", 1)
            : st.lang == "no"
              ? mk("NO", 1)
              : mk(P, 1) + (S ? mk(S, 0) : "");
        return (c ? `<span class=code>${o.code}</span>` : "") + body;
      }
      const mc = (o) => (miss(o) ? " missing" : "");
      const cb = (o) =>
        o.code
          ? `<input type=checkbox class=cb data-k=${o.code} aria-label="${o.code}" onclick="event.stopPropagation()" onchange="tog('${o.code}',this.checked)">`
          : "";
      const l2 = (o) =>
        `<div class="l2${mc(o)}" data-c=${o.code} onclick="show('${
          o.code
        }')">${cb(o)}${lab(o, 1)}</div>`;
      const l1 = (o, style = "") =>
        `<div class="l1${mc(o)}" data-c=${
          o.code
        } style="${style}"><div class=t onclick="show('${o.code}')">${cb(
          o,
        )}${lab(o, 1)}</div><div class=kids>${o.kids
          .map(l2)
          .join("")}</div></div>`;
      // One grid per value stream; columns are "tile columns" (an L1 box is 1 or 2 wide), sized in fr so the stream always fills the page.
      // Phases are block arrows in flow order; groups spanning Recruit..Confer sit beneath those phases only, so Design stays a single full-height column.
      function chainHtml(c) {
        const ph = c.segments.filter((x) => !x.span),
          sp = c.segments.filter((x) => x.span);
        const wd = (g) => g.caps.reduce((a, o) => a + o.cols, 0),
          start = [];
        let T = 1;
        ph.forEach((g) => {
          start.push(T);
          T += wd(g);
        });
        T--;
        let s = `<div class="chain box s-${sc(
          c.en,

            where = [
              seg ? (P == "NO" ? o.segNo || seg.no : o.segEn || seg.en) : "",
              p ? `${p.code} ${nm(p, P) || p.en}` : "",
            ]
              .filter(Boolean)
              .join("  >  ");
          put(
            `${o.code}  ${nm(o, P) || nm(o, P == "NO" ? "EN" : "NO")}`,
            10.5,
            "bold",
            INK,
            0,
          );
          if (where) put(where, 7.5, "normal", GREY, 0.6);
          const t = ds(o, P) || "[" + P + " text missing]";
          put(t, 9, "normal", INK, 0.8);
          if (S) {
            put(`${nm(o, S) || "[" + S + " missing]"}`, 8.5, "bold", GREY, 0);
            put(ds(o, S) || "", 8, "normal", GREY, 0.8);
          }
          y += 2.5;
        }
        const n = doc.getNumberOfPages();
        for (let i = 1; i <= n; i++) {
          doc.setPage(i);
          doc.setFontSize(7);
          doc.setTextColor(...GREY);
          doc.text(
            L(`HERM ${M.version} · ${curName()} · ${i}/${n}`),
            Mg,
            297 - 8,
          );
          if (M.license)
            doc.text(L(M.license), 210 - Mg, 297 - 8, { align: "right" });
        }
        doc.save(`herm-brm-${slug(curName())}-${today()}.pdf`);
      }
      render();
    </script>
  </body>
</html>
