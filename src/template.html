<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="herm-template-version" content="9" />
    <title>HERM BRM __V__</title>
    <style>
      /* Palette: NTNU graphic profile. Each stream sets --hd (header), --l1 (L1 box), --bd (border). */
      :root {
        --bg: #fff;
        --fg: #282d37;
        --mut: #505862;
        --ac: #00509e;
        --l2: #fff;
        --hit: #fdd9b5;
        --hitbd: #ef8114;
        --red: #d32f2f;
        --sel: #fdf0c4;
        --hd: #00509e;
        --l1: #cfdaf1;
        --bd: #9db7e1;
        --a: 14px;
      }
      .s-lt {
        --hd: #00509e;
        --l1: #cfdaf1;
        --bd: #9db7e1;
      }
      .s-res {
        --hd: #2e7578;
        --l1: #d1eaeb;
        --bd: #97d2d4;
      }
      .s-ena {
        --hd: #7d705a;
        --l1: #eee5d5;
        --bd: #e0d0af;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161b26;
          --fg: #e6e9f0;
          --mut: #c3cada;
          --ac: #9dbdec;
          --l2: #1d2638;
          --hit: #5a3a14;
          --hitbd: #f4ac67;
          --red: #ff6b6b;
          --sel: #5a4a14;
        }
        .s-lt {
          --hd: #3e628a;
          --l1: #253a55;
          --bd: #3e628a;
        }
        .s-res {
          --hd: #2e7578;
          --l1: #1f3a3c;
          --bd: #2e7578;
        }
        .s-ena {
          --hd: #7d705a;
          --l1: #3d3732;
          --bd: #7d705a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font:
          13px/1.35 system-ui,
          sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 15;
        background: var(--bg);
        padding: 8px 14px;
        border-bottom: 1px solid #9db7e1;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      h1 {
        font-size: 16px;
        margin: 0 8px 0 0;
      }
      button,
      input {
        font: inherit;
        padding: 3px 9px;
        border: 1px solid #9db7e1;
        background: var(--l2);
        color: var(--fg);
        border-radius: 4px;
      }
      button.on {
        background: #00509e;
        color: #fff;
      }
      .legend {
        color: var(--mut);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 14px;
        height: 14px;
        border: 2px solid var(--red);
        border-radius: 3px;
      }
      main {
        padding: 14px;
      }
      .ic {
        display: inline-block;
        min-width: 1.15em;
        text-align: center;
        font-style: normal;
      }
      .lic {
        text-align: center;
        font-size: 11px;
        color: var(--mut);
        padding: 8px 14px 18px;
      }
      .lic:empty {
        display: none;
      }
      h2 {
        font-size: 16px;
        margin: 18px 0 6px;
      }
      .box {
        border: 1px solid var(--bd);
        border-radius: 4px;
        padding: 6px;
        margin-bottom: 12px;
        width: 100%;
      }
      .chain {
        display: grid;
        gap: 6px;
      }
      /* block arrows: flow of the value stream */
      .ph {
        background: var(--hd);
        color: #fff;
        text-align: center;
        font-weight: 600;
        padding: 8px calc(var(--a) + 6px);
        margin-right: calc(var(--a) * -0.6);
        min-width: 0;
        clip-path: polygon(
          0 0,
          calc(100% - var(--a)) 0,
          100% 50%,
          calc(100% - var(--a)) 100%,
          0 100%,
          var(--a) 50%
        );
      }
      .ph.first {
        padding-left: 10px;
        clip-path: polygon(
          0 0,
          calc(100% - var(--a)) 0,
          100% 50%,
          calc(100% - var(--a)) 100%,
          0 100%
        );
      }
      .ph .sec {
        color: #fff;
      }
      .l1 {
        background: var(--l1);
        border: 1px solid var(--bd);
        border-radius: 3px;
        padding: 5px;
        min-width: 0;
      }
      .l1 > .t {
        font-weight: 600;
        font-size: 12.5px;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .kids {
        display: grid;
        gap: 4px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr));
      }
      .l2 {
        background: var(--l2);
        border: 1px solid var(--bd);
        border-radius: 2px;
        padding: 3px 4px;
        cursor: pointer;
        font-size: 11.5px;
        min-width: 0;
      }
      .l1,
      .l2,
      .ph,
      li {
        overflow-wrap: break-word;
        hyphens: auto;
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .wrap .l1 {
        flex: 1 1 320px;
      }
      .code {
        color: var(--mut);
        font-size: 10px;
        display: block;
      }
      .sec {
        color: var(--mut);
        display: block;
        font-size: 11px;
        font-weight: 400;
      }
      .miss {
        font-style: italic;
      }
      .missing {
        border-color: var(--red) !important;
        box-shadow: inset 0 0 0 1px var(--red);
      }
      li.missing {
        border: 1px solid var(--red);
        border-radius: 3px;
        padding: 0 4px;
      }
      .bar {
        flex-basis: 100%;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        border-top: 1px solid #9db7e1;
        padding-top: 6px;
      }
      .bar select {
        max-width: 260px;
        font: inherit;
        padding: 3px;
        background: var(--l2);
        color: var(--fg);
        border: 1px solid #9db7e1;
        border-radius: 4px;
      }
      .st {
        color: var(--mut);
      }
      .st b {
        color: var(--red);
      }
      .warn {
        background: #fdd9b5;
        color: #282d37;
        padding: 4px 10px;
        border-radius: 4px;
        flex-basis: 100%;
      }
      .pri {
        background: #00509e !important;
        color: #fff !important;
      }
      .danger {
        border-color: var(--red) !important;
        color: var(--red);
      }
      .cb {
        position: absolute;
        top: 2px;
        right: 2px;
        margin: 0;
        cursor: pointer;
      }
      .l1 > .t .cb {
        position: static;
        float: right;
        margin: 1px 0 0 4px;
      }
      .l2 {
        position: relative;
        padding-right: 18px;
      }
      li .cb {
        margin-right: 6px;
        vertical-align: middle;
      }
      .sel {
        background: var(--sel) !important;
      }
      li.sel {
        border-radius: 3px;
      }
      dialog {
        border: 1px solid #9db7e1;
        border-radius: 6px;
        padding: 16px 18px;
        max-width: 480px;
        width: calc(100% - 32px);
        background: var(--bg);
        color: var(--fg);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      dialog h3 {
        margin: 0 0 8px;
      }
      dialog input {
        width: 100%;
        margin: 6px 0 10px;
      }
      .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .dim {
        color: var(--mut);
      }
      .dim:not(.sel) {
        background: transparent !important;
      }
      .part > .t {
        color: var(--mut);
      }
      ::placeholder {
        color: var(--mut);
        opacity: 1;
      }
      .hit {
        outline: 2px solid var(--hitbd);
        background: var(--hit) !important;
      }
      details {
        margin-left: 16px;
      }
      summary {
        cursor: pointer;
      }
      button,
      select,
      summary,
      input[type="checkbox"],
      .cb,
      .l2,
      .l1 > .t,
      li[data-c] {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      .help {
        position: relative;
      }
      #ub {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .help > summary {
        list-style: none;
        padding: 3px 9px;
        border: 1px solid #9db7e1;
        border-radius: 4px;
        background: var(--l2);
        user-select: none;
      }
      .help > summary::-webkit-details-marker {
        display: none;
      }
      .help[open] > summary {
        background: #00509e;
        color: #fff;
      }
      .hb {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        width: min(620px, 92vw);
        max-height: 70vh;
        overflow: auto;
        background: var(--bg);
        border: 1px solid #9db7e1;
        border-radius: 6px;
        padding: 4px 16px 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        z-index: 20;
        line-height: 1.45;
      }
      .hb h4 {
        margin: 14px 0 4px;
        color: var(--ac);
      }
      .hb p {
        margin: 4px 0;
      }
      .hb ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      .hb li {
        list-style: disc;
        margin: 3px 0;
      }
      li {
        list-style: none;
        margin: 1px 0;
      }
      #d {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        border-top: 2px solid #00509e;
        padding: 10px 14px;
        display: none;
        max-height: 45vh;
        overflow: auto;
        z-index: 9;
      }
      #d .c {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      #d h3 {
        margin: 2px 0;
      }
      #d small,
      #d .sec {
        color: var(--mut);
      }
      /* narrow screens: phases stack top to bottom with down-pointing arrows */
      @media (max-width: 1000px) {
        .chain {
          grid-template-columns: minmax(0, 1fr) !important;
        }
        .chain > * {
          grid-column: 1/-1 !important;
          grid-row: auto !important;
        }
        .ph,
        .ph.first {
          margin: 0 0 -4px;
          padding: 8px 10px calc(var(--a) + 4px);
          clip-path: polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--a)),
            50% 100%,
            0 calc(100% - var(--a))
          );
        }
        #d .c {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>HERM __V__ BRM</h1>
      <span id="lb"></span><span id="vb"></span><input id="q" /><span
        class="legend"
        ><i></i><span id="mc"></span
      ></span>
      <span id="ub"></span>
      <details class="help" id="help" hidden>
        <summary id="hs"></summary>
        <div class="hb" id="hb"></div>
      </details>
      <div class="bar" id="bar"></div>
    </header>
    <main id="m"></main>
    <footer class="lic" id="lic"></footer>
    <div id="d"></div>
    <dialog id="dg"></dialog>
    <input
      type="file"
      id="fi"
      accept=".json,application/json"
      hidden
      onchange="impFile(this)"
    />
    <script>
      __JSPDF__;
    </script>
    <script>
      const M = __DATA__,
        [P, S] = M.langs,
        st = { lang: "both", ui: "EN", view: "diagram" }; // lang = content language (both/en/no); ui = interface language (EN/NO), independent. NB: not a global "lang": inline handlers resolve names on the element first
      const cnt = {
          NO: (n) => `${n} kapabilitet${n == 1 ? "" : "er"}`,
          EN: (n) => `${n} ${n == 1 ? "capability" : "capabilities"}`,
        },
        cntSel = {
          NO: (n) =>
            `${n} ${n == 1 ? "valgt kapabilitet" : "valgte kapabiliteter"}`,
          EN: (n) => `${n} selected ${n == 1 ? "capability" : "capabilities"}`,
        };
      const UI = {
        NO: {
          level: "Nivå",
          parent: "overordnet",
          textMissing: (L) => `[${L} tekst mangler]`,
          missShort: (L) => `${L} mangler`,
          core: "Kjerne",
          enabling: "Muliggjørende",
          savedList: "Lagrede utvalg",
          contentLang: "Innholdsspråk",
          uiLang: "Grensesnittspråk",
          tipBoth: "Vis begge språk",
          tipEn: "Vis engelsk",
          tipNo: "Vis norsk",
          search: "Søk kode / navn…",
          missing: "mangler oversettelse",
          diagram: "Diagram",
          tree: "Tre",
          close: "Lukk",
          sel: "valgt",
          select: "Velg",
          deselect: "Fjern valg",
          newOpt: "Nytt utvalg (ulagret)",
          save: "Lagre",
          saveAs: "Lagre som…",
          fresh: "Nytt utvalg",
          del: "Slett / tøm",
          json: "Eksporter JSON",
          pdf: "Eksporter A4",
          pdfA3: "Eksporter A3",
          imp: "Importer JSON",
          unsaved: "ulagrede endringer",
          saved: "lagret",
          dlgName: "Navn på utvalget",
          defName: (n) => `Utvalg ${n}`,
          cancel: "Avbryt",
          warnTitle: "Lagre før du fortsetter?",
          warn: (n, c) =>
            `Du har ulagrede endringer i «${n}» (${cnt.NO(
              c,
            )}). Fortsetter du uten å lagre, går de tapt.`,
          warnNoStore: (n, c) =>
            `Du har ulagrede endringer i «${n}» (${cnt.NO(
              c,
            )}), og nettleseren tillater ikke lagring. Eksporter JSON først hvis du vil beholde dem.`,
          saveGo: "Lagre og fortsett",
          discard: "Forkast og fortsett",
          clearTitle: "Tømme utvalget?",
          clearMsg: (n) =>
            `${cntSel.NO(
              n,
            )} fjernes fra utvalget. Utvalget er ikke lagret, så dette kan ikke angres.`,
          savedTitle: (n) => `Tømme eller slette «${n}»?`,
          savedMsg: (n, c) =>
            c
              ? `«${n}» har ${cntSel.NO(
                  c,
                )}. «Tøm utvalget» fjerner valgene, men beholder lagringen til du lagrer på nytt. «Slett lagret utvalg» fjerner lagringen fra denne nettleseren og tømmer utvalget. Ingen av delene kan angres.`
              : `«${n}» slettes fra denne nettleseren. Det kan ikke angres.`,
          clearBtn: "Tøm utvalget",
          delBtn: "Slett lagret utvalg",
          noStore:
            "Nettleseren tillater ikke lagring (privat modus?). Du kan fortsatt eksportere utvalget.",
          badFile: "Filen er ikke et gyldig utvalg.",
          unknown: (n) =>
            `${n} ${
              n == 1 ? "ukjent kode ble" : "ukjente koder ble"
            } hoppet over.`,
          pdfTitle: "Valgte kapabiliteter",
          pdfCount: (n) => cnt.NO(n),
          noPdf: "PDF-biblioteket er ikke lastet.",
          untitled: "Utvalg",
        },
        EN: {
          level: "Level",
          parent: "parent",
          textMissing: (L) => `[${L} text missing]`,
          missShort: (L) => `${L} missing`,
          core: "Core",
          enabling: "Enabling",
          savedList: "Saved selections",
          contentLang: "Content language",
          uiLang: "Interface language",
          tipBoth: "Show both languages",
          tipEn: "Show English",
          tipNo: "Show Norwegian",
          search: "Search code / name…",
          missing: "missing translation",
          diagram: "Diagram",
          tree: "Tree",
          close: "Close",
          sel: "selected",
          select: "Select",
          deselect: "Deselect",
          newOpt: "New selection (unsaved)",
          save: "Save",
          saveAs: "Save as…",
          fresh: "New selection",
          del: "Delete / clear",
          json: "Export JSON",
          pdf: "Export A4",
          pdfA3: "Export A3",
          imp: "Import JSON",
          unsaved: "unsaved changes",
          saved: "saved",
          dlgName: "Name of the selection",
          defName: (n) => `Selection ${n}`,
          cancel: "Cancel",
          warnTitle: "Save before continuing?",
          warn: (n, c) =>
            `You have unsaved changes in "${n}" (${cnt.EN(
              c,
            )}). If you continue without saving they will be lost.`,
          warnNoStore: (n, c) =>
            `You have unsaved changes in "${n}" (${cnt.EN(
              c,
            )}), and the browser does not allow saving. Export JSON first if you want to keep them.`,
          saveGo: "Save and continue",
          discard: "Discard and continue",
          clearTitle: "Clear the selection?",
          clearMsg: (n) =>
            `${cntSel.EN(
              n,
            )} will be removed from the selection. It is not saved, so this cannot be undone.`,
          savedTitle: (n) => `Clear or delete "${n}"?`,
          savedMsg: (n, c) =>
            c
              ? `"${n}" has ${cntSel.EN(
                  c,
                )}. "Clear selection" removes the ticks but keeps the save until you save again. "Delete saved selection" removes the save from this browser and clears the selection. Neither can be undone.`
              : `"${n}" will be deleted from this browser. This cannot be undone.`,
          clearBtn: "Clear selection",
          delBtn: "Delete saved selection",
          noStore:
            "The browser does not allow saving (private mode?). You can still export the selection.",
          badFile: "The file is not a valid selection.",
          unknown: (n) =>
            `${n} unknown ${n == 1 ? "code was" : "codes were"} skipped.`,
          pdfTitle: "Selected capabilities",
          pdfCount: (n) => cnt.EN(n),
          noPdf: "The PDF library is not loaded.",
          untitled: "Selection",
        },
      };
      // Interface language is chosen independently of the content language (st.lang).
      let T = UI.EN;
      const uiLang = () => st.ui,
        order = () =>
          st.lang == "no"
            ? ["NO", "EN"]
            : st.lang == "en"
              ? ["EN", "NO"]
              : M.langs, // content order for the detail panel and the PDF export
        setT = () => {
          T = UI[uiLang()];
          document.documentElement.lang = uiLang() == "NO" ? "nb" : "en";
        },
        lg = (L) => (L == "NO" ? "nb" : "en");
      // Icons are decorative (aria-hidden); the text label carries the meaning.
      const IC = {
          lang: "🌐",
          ui: "🖥️",
          diagram: "🗺️",
          tree: "🌳",
          help: "ℹ️",
          saves: "📁",
          save: "💾",
          saveAs: "📑",
          fresh: "➕",
          del: "🗑️",
          imp: "📥",
          json: "📤",
          pdf: "📄",
          pdfA3: "📄",
          close: "✖",
          select: "☑️",
          deselect: "⬜",
          saveGo: "💾",
          discard: "🚫",
          cancel: "↩️",
          clearBtn: "🧹",
          delBtn: "🗑️",
          ok: "✔",
        },
        ic_ = (g) => `<span class=ic aria-hidden="true">${g}</span>`,
        ic = (k) => ic_(IC[k]),
        ib = (k) => `${ic(k)} ${T[k]}`;
      const h = (s) =>
        String(s).replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );
      const idx = {};
      (function w(o) {
        if (o.code) idx[o.code] = o;
        ["caps", "kids", "segments", "chains", "domains"].forEach((k) =>
          (o[k] || []).forEach(w),
        );
      })({ domains: M.domains });
      const nm = (o, L) => (L == "NO" ? o.no : o.en),
        ds = (o, L) => (L == "NO" ? o.no_desc : o.en_desc);
      const miss = (o) =>
        !!o.code && ["NO", "EN"].some((L) => !nm(o, L) || !ds(o, L)); // a missing name or description in either language
      const sc = (n) =>
        n == "Research" ? "res" : n == "Enabling" ? "ena" : "lt";
      function lab(o, c) {
        const O = (L) => (L == "NO" ? "EN" : "NO"),
          mk = (L, pri) =>
            nm(o, L)
              ? pri
                ? `<b lang=${lg(L)}>${h(nm(o, L))}</b>`
                : `<span class=sec lang=${lg(L)}>${h(nm(o, L))}</span>`
              : pri
                ? `<b class=miss lang=${lg(O(L))}>${h(nm(o, O(L)))}</b>`
                : `<span class=sec><i>(${T.missShort(L)})</i></span>`;
        const body =
          st.lang == "en"
            ? mk("EN", 1)
            : st.lang == "no"
              ? mk("NO", 1)
              : mk(P, 1) + (S ? mk(S, 0) : "");
        return (c ? `<span class=code>${o.code}</span>` : "") + body;
      }
      const mc = (o) => (miss(o) ? " missing" : "");
      const cb = (o) =>
        o.code
          ? `<input type=checkbox class=cb data-k=${o.code} aria-label="${o.code}" onclick="event.stopPropagation()" onchange="tog('${o.code}',this.checked)">`
          : "";
      const l2 = (o) =>
        `<div class="l2${mc(o)}" data-c=${o.code} onclick="show('${
          o.code
        }')">${cb(o)}${lab(o, 1)}</div>`;
      const l1 = (o, style = "") =>
        `<div class="l1${mc(o)}" data-c=${
          o.code
        } style="${style}"><div class=t onclick="show('${o.code}')">${cb(
          o,
        )}${lab(o, 1)}</div><div class=kids>${o.kids
          .map(l2)
          .join("")}</div></div>`;
      // One grid per value stream; columns are "tile columns" (an L1 box is 1 or 2 wide), sized in fr so the stream always fills the page.
      // Phases are block arrows in flow order; groups spanning Recruit..Confer sit beneath those phases only, so Design stays a single full-height column.
      function chainHtml(c) {
        const ph = c.segments.filter((x) => !x.span),
          sp = c.segments.filter((x) => x.span);
        const wd = (g) => g.caps.reduce((a, o) => a + o.cols, 0),
          start = [];
        let T = 1;
        ph.forEach((g) => {
          start.push(T);
          T += wd(g);
        });
        T--;

        put(curName(), 18, "bold", RGB.lt, 1);
        put(
          `${T.pdfTitle} · HERM ${M.version} · ${today()} · ${T.pdfCount(
            rows.length,
          )}`,
          9,
          "normal",
          GREY,
          5,
        );
        let last = null;
        for (const { o, stream, key, seg } of rows) {
          if (stream !== last) {
            last = stream;
            y += 2;
            put(nm(stream, P) || stream.en, 12, "bold", RGB[key], 0.5);
            doc.setDrawColor(...RGB[key]);
            doc.line(Mg, y, Mg + Wd, y);
            y += 2.5;
          }
          const p = o.parent ? idx[o.parent] : null,
            where = [
              seg ? (P == "NO" ? o.segNo || seg.no : o.segEn || seg.en) : "",
              p ? `${p.code} ${nm(p, P) || p.en}` : "",
            ]
              .filter(Boolean)
              .join("  >  ");
          put(
            `${o.code}  ${nm(o, P) || nm(o, P == "NO" ? "EN" : "NO")}`,
            10.5,
            "bold",
            INK,
            0,
          );
          if (where) put(where, 7.5, "normal", GREY, 0.6);
          const t = ds(o, P) || "[" + P + " text missing]";
          put(t, 9, "normal", INK, 0.8);
          if (S) {
            put(`${nm(o, S) || "[" + S + " missing]"}`, 8.5, "bold", GREY, 0);
            put(ds(o, S) || "", 8, "normal", GREY, 0.8);
          }
          y += 2.5;
        }
        const n = doc.getNumberOfPages();
        for (let i = 1; i <= n; i++) {
          doc.setPage(i);
          doc.setFontSize(7);
          doc.setTextColor(...GREY);
          doc.text(
            L(`HERM ${M.version} · ${curName()} · ${i}/${n}`),
            Mg,
            297 - 8,
          );
          if (M.license)
            doc.text(L(M.license), 210 - Mg, 297 - 8, { align: "right" });
        }
        doc.save(fileName("pdf", "A4"));
      }
      // ===== A3 export: the workshop capability map (A-poster-A3.pdf, drawn by src/kit.js), filled in =====
      // Same layout as the printed poster (same fit search, same boxes), drawn with jsPDF; the selection is ticked
      // and highlighted, and the name and date fields are filled in. Units: mm; font sizes in pt.
      // BEGIN A3 POSTER
      function drawPosterPdf(lib, { P, S, sel, name, date, footer }) {
        const K = M.poster,
          PT = 25.4 / 72,
          LH = 1.306, // pdfkit Helvetica line height incl. the 0.15 line gap used by the poster
          ASC = 0.718, // Helvetica ascender: pdfkit places the baseline this far below the text top
          RED = "#d32f2f",
          SEL = "#fdf0c4",
          MG = 6,
          GAP = 0.8,
          PAD = 1,
          TITLE = 6,
          CHEV = 6.5,
          HEAD = 5.5,
          HEADER = 12,
          FOOT = 5,
          W2 = 420 - 2 * MG,
          MINTW = 27;
        const doc = new lib.jsPDF({
          orientation: "landscape",
          unit: "mm",
          format: "a3",
        });
        doc.setProperties({
          title: `HERM BRM ${M.version} - ${name}`,
          subject: M.license || "",
        });
        const FS = { r: "normal", b: "bold", i: "italic" },
          colOf = (o) => K.colors[o.stream] || K.colors.Enabling,
          font = (f, z) => {
            doc.setFont("helvetica", f);
            doc.setFontSize(z);
          },
          tw = (t, f, z) => (font(f, z), doc.getTextWidth(t));
        // one line, shrunk to fit w (then cut with an ellipsis); y = top of the text
        function oneLine(t, { x, y, w, f = "r", size, min = 4, color, align = "left" }) {
          t = pdfSafe(t);
          let s = size;
          while (s > min && tw(t, FS[f], s) > w) s -= 0.25;
          if (tw(t, FS[f], s) > w) {
            while (t.length > 1 && tw(t + "...", FS[f], s) > w) t = t.slice(0, -1);
            t += "...";
          }
          font(FS[f], s);
          doc.setTextColor(color);
          const ax = align == "center" ? x + w / 2 : align == "right" ? x + w : x;
          doc.text(t, ax, y + ASC * s * PT, { align, baseline: "alphabetic" });
        }
        const lines = (t, f, z, w) => (font(f, z), doc.splitTextToSize(t, w));
        // wrapped text at a fixed size, cut at height h; returns the height used
        function block(t, { x, y, w, h, f, size, color }) {
          const ls = lines(t, f, size, w),
            lh = size * LH * PT,
            n = Math.max(1, Math.min(ls.length, Math.floor((h + 0.01) / lh)));
          const out = ls.slice(0, n);
          if (n < ls.length) {
            let l = out[n - 1];
            while (l.length > 1 && tw(l + "...", f, size) > w) l = l.slice(0, -1);
            out[n - 1] = l + "...";
          }
          font(f, size);
          doc.setTextColor(color);
          out.forEach((l, i) =>
            doc.text(l, x, y + i * lh + ASC * size * PT, { baseline: "alphabetic" }),
          );
          return Math.min(ls.length * lh, h);
        }
        const style = (o, L, pri) => {
          const t = L == "NO" ? o.no : o.en;
          return t
            ? { t: pdfSafe(t), f: pri ? FS.b : FS.r, color: pri ? K.ink : K.muted }
            : { t: pdfSafe(K.labels[L].missingName), f: FS.i, color: K.muted };
        };
        // primary name (bold) with the secondary name muted beneath; shrinks until it fits and no word is broken
        function nameBlock(o, { x, y, w, h, max, min, prefix = "" }) {
          const a = style(o, P, true),
            b = S && style(o, S, false);
          a.t = prefix + a.t;
          const H = (p, z) => lines(p.t, p.f, z, w).length * z * LH * PT,
            wide = (p, z) => Math.max(...p.t.split(/\s+/).map((q) => tw(q, p.f, z)));
          let s = max;
          const bad = () =>
            H(a, s) + (b ? H(b, s * 0.75) + PT : 0) > h ||
            wide(a, s) > w ||
            (b && wide(b, s * 0.75) > w);
          while (s > min && bad()) s -= 0.2;
          const used = block(a.t, { x, y, w, h, f: a.f, size: s, color: a.color });
          if (b && h - used - PT > 0)
            block(b.t, { x, y: y + used + PT, w, h: h - used - PT, f: b.f, size: s * 0.75, color: b.color });
        }
        const tickBox = (x, y, c, on) => {
          doc.setLineWidth(0.4 * PT).setDrawColor(c.dark);
          if (on) {
            doc.setFillColor("#fff").rect(x, y, 2.3, 2.3, "FD");
            doc.setLineWidth(0.9 * PT).lines([[0.5, 0.55], [1, -1.3]], x + 0.45, y + 1.15, [1, 1], "S");
          } else doc.rect(x, y, 2.3, 2.3, "S");
        };
        const poly = (pts, color) =>
          doc
            .setFillColor(color)
            .lines(pts.slice(1).map((p, i) => [p[0] - pts[i][0], p[1] - pts[i][1]]), pts[0][0], pts[0][1], [1, 1], "F", true);
        function chevrons({ x, y, w, h, items, weights, c, fs }) {
          const notch = h * 0.28,
            gap = 1.2,
            tot = weights.reduce((p, q) => p + q, 0),
            usable = w - (notch - gap),
            cells = [];
          let acc = 0;
          items.forEach((it, i) => {
            const a = x + (usable * acc) / tot;
            acc += weights[i];
            const cr = x + (usable * acc) / tot,
              bx = cr + notch - gap;
            cells.push({ x: a, w: cr - a });
            const pts = [[a, y], [bx - notch, y], [bx, y + h / 2], [bx - notch, y + h], [a, y + h]];
            if (i > 0) pts.push([a + notch, y + h / 2]);
            poly(pts, c.light);
            const tx = a + (i > 0 ? notch : 0) + 1,
              tww = bx - a - notch * (i > 0 ? 2 : 1) - 2,
              h1 = fs * 1.2 * PT,
              h2 = it.S ? fs * 0.62 * 1.2 * PT : 0,
              ty = y + (h - h1 - h2) / 2;
            oneLine(it.P, { x: tx, y: ty, w: tww, f: "b", size: fs, color: K.ink, align: "center" });
            if (h2) oneLine(it.S, { x: tx, y: ty + h1, w: tww, size: fs * 0.62, color: K.muted, align: "center" });
          });
          return cells;
        }
        // ---- layout plan: identical to streamPlan / enablingPlan in src/kit.js ----
        const boxH = (k, n, th) => PAD + TITLE + Math.ceil(k / n) * th + (Math.ceil(k / n) - 1) * GAP + PAD;
        function streamPlan(chain, th) {
          const ph = chain.segments.filter((s) => !s.span),
            sp = chain.segments.filter((s) => s.span),
            wd = (g) => g.caps.reduce((a, o) => a + o.cols, 0),
            units = (a, b) => ph.slice(a, b + 1).reduce((q, g) => q + wd(g), 0),
            covered = (i) => sp.some((g) => i >= g.range[0] && i <= g.range[1]),
            spanH = sp.map((g) => g.caps.map((o) => boxH(o.kids.length, units(...g.range), th))),
            spanTotal = spanH.flat().reduce((a, v) => a + v + GAP, 0);
          let rowH = 0,
            free = 0;
          ph.forEach((g, i) =>
            g.caps.forEach((o) => {
              const h = boxH(o.kids.length, o.cols, th);
              if (covered(i)) rowH = Math.max(rowH, h);
              else free = Math.max(free, h);
            }),
          );
          rowH = Math.max(rowH, free - spanTotal);
          return { ph, sp, wd, units, covered, spanH, spanTotal, rowH, height: CHEV + 1.5 + rowH + spanTotal };
        }
        function enablingPlan(caps, th, nc) {
          const bw = (W2 - (nc - 1) * GAP) / nc,
            tpr = Math.max(1, Math.floor((bw - 2 * PAD + GAP) / (MINTW + GAP))),
            cols = Array(nc).fill(0);
          const sized = caps.map((o, i) => ({ o, i, h: boxH(o.kids.length, tpr, th) })).sort((a, b) => b.h - a.h);
          sized.forEach((b) => {
            b.c = cols.indexOf(Math.min(...cols));
            cols[b.c] += b.h + GAP;
          });
          const run = Array(nc).fill(0);
          const placed = sized
            .slice()
            .sort((a, b) => a.i - b.i)
            .map((b) => {
              const y = run[b.c];
              run[b.c] += b.h + GAP;
              return { o: b.o, c: b.c, y, h: b.h };
            });
          return { bw, tpr, placed, height: Math.max(...cols) - GAP };
        }
        // ---- drawing ----
        function tile(o, x, y, w, h) {
          const c = colOf(o),
            m = miss(o),
            on = sel.has(o.code);
          doc
            .setLineWidth((m || on ? 0.9 : 0.3) * PT)
            .setDrawColor(m ? RED : on ? c.dark : c.mid)
            .setFillColor(on ? SEL : "#fff")
            .roundedRect(x, y, w, h, 0.8, 0.8, "FD");
          oneLine(o.code, { x: x + 1, y: y + 0.7, w: 12, f: "b", size: 4.6, color: c.dark });
          tickBox(x + w - 3.1, y + 0.8, c, on);
          nameBlock(o, { x: x + 1, y: y + 3.4, w: w - 2, h: h - 3.9, max: 6.4, min: 4 });
        }
        function box(o, x, y, w, h, n, th) {
          const c = colOf(o),
            m = miss(o),
            on = sel.has(o.code);
          doc
            .setLineWidth((m ? 0.9 : on ? 1.2 : 0.4) * PT)
            .setDrawColor(m ? RED : on ? c.dark : c.mid)
            .setFillColor(c.light)
            .roundedRect(x, y, w, h, 1, 1, "FD");
          if (on) doc.setFillColor(SEL).rect(x + 0.3, y + 0.3, w - 0.6, TITLE + PAD - 0.5, "F");
          tickBox(x + w - (PAD + 2.6), y + PAD, c, on);
          nameBlock(o, { x: x + PAD + 0.3, y: y + PAD, w: w - (2 * PAD + 3.2), h: TITLE - 0.4, max: 6.8, min: 4.2, prefix: `${o.code}  ` });
          const kw = (w - 2 * PAD - (n - 1) * GAP) / n,
            ty = y + PAD + TITLE;
          o.kids.forEach((k, i) =>
            tile(k, x + PAD + (i % n) * (kw + GAP), ty + Math.floor(i / n) * (th + GAP), kw, th),
          );
        }
        const lab = (o) => ({ P: o[P.toLowerCase()], S: S && o[S.toLowerCase()] });
        function stream(chain, y0, th) {
          const c = K.colors[chain.en],
            pl = streamPlan(chain, th);
          // phase arrows show the primary language only, as on the printed poster
          const cells = chevrons({ x: MG, y: y0, w: W2, h: CHEV, c, fs: 7.5, items: pl.ph.map((g) => ({ P: lab(g).P })), weights: pl.ph.map(pl.wd) });
          const yRow = y0 + CHEV + 1.5;
          pl.ph.forEach((g, i) => {
            let off = 0;
            const total = pl.wd(g);
            g.caps.forEach((o) => {
              const x = cells[i].x + (off / total) * cells[i].w,
                w = (o.cols / total) * cells[i].w - GAP;
              box(o, x, yRow, w, pl.covered(i) || !pl.sp.length ? pl.rowH : pl.rowH + pl.spanTotal - GAP, o.cols, th);
              off += o.cols;
            });
          });
          let yy = yRow + pl.rowH + GAP;
          pl.sp.forEach((g, gi) =>
            g.caps.forEach((o, k) => {
              const x0 = cells[g.range[0]].x,
                x1 = cells[g.range[1]].x + cells[g.range[1]].w - GAP;
              box(o, x0, yy, x1 - x0, pl.spanH[gi][k], pl.units(...g.range), th);
              yy += pl.spanH[gi][k] + GAP;
            }),
          );
        }
        function heading(o, key, y) {
          const l = lab(o),
            c = K.colors[key];
          oneLine(l.P, { x: MG, y, w: 200, f: "b", size: 9, color: c.dark });
          if (l.S) oneLine(l.S, { x: MG + tw(pdfSafe(l.P), FS.b, 9) + 2, y: y + PT, w: 200, size: 7, color: K.muted });
        }
        const chains = M.domains[0].chains,
          ena = M.domains[1],
          avail = 297 - 2 * MG - FOOT - HEADER;
        let best = null;
        for (let th = 15; th >= 8.5 && !best; th -= 0.25)
          for (const nc of [4, 5, 6, 7, 8]) {
            const e = enablingPlan(ena.caps, th, nc),
              total = chains.reduce((q, c) => q + HEAD + streamPlan(c, th).height + 2, 0) + HEAD + e.height;
            if (total <= avail && (!best || e.height < best.e.height)) best = { th, e };
          }
        if (!best) throw new Error("poster: capabilities do not fit on one A3");
        const { th, e } = best;
        // header: title + filled-in name and date
        oneLine(K.labels[P].posterTitle, { x: MG, y: MG, w: 200, f: "b", size: 16, color: K.colors["Learning & Teaching"].dark });
        if (S) oneLine(`${K.labels[S].posterTitle}  ·  HERM ${M.version}`, { x: MG, y: MG + 7, w: 200, size: 8, color: K.muted });
        [
          ["name", name, 95],
          ["date", date, 80],
        ].forEach(([k, v, w], i) => {
          const x = MG + 215 + i * 105,
            l = `${K.labels[P][k]}${S ? " / " + K.labels[S][k] : ""}`,
            vx = x + tw(pdfSafe(l), FS.r, 6) + 3;
          oneLine(l, { x, y: MG + 3, w: 60, size: 6, color: K.muted });
          doc.setLineWidth(0.4 * PT).setDrawColor(K.ink).line(x, MG + 8.5, x + w, MG + 8.5);
          oneLine(v, { x: vx, y: MG + 4, w: x + w - vx, f: "b", size: 10, min: 6, color: K.ink });
        });
        let y = MG + HEADER;
        for (const ch of chains) {
          heading(ch, ch.en, y);
          y += HEAD;
          stream(ch, y, th);
          y += streamPlan(ch, th).height + 2;
        }
        heading(ena, "Enabling", y);
        y += HEAD;
        e.placed.forEach(({ o, c, y: oy, h }) => box(o, MG + c * (e.bw + GAP), y + oy, e.bw, h, e.tpr, th));
        oneLine(`HERM ${M.version} Business Reference Model · CC BY-NC-SA 4.0 · CAUDIT / EDUCAUSE / UCISA / EUNIS  ·  ${footer}`, {
          x: MG,
          y: 297 - MG,
          w: W2,
          size: 5.5,
          color: K.muted,
        });
        return doc;
      }
      // END A3 POSTER
      function exportPosterPdf() {
        const lib = window.jspdf;
        if (!lib) {
          alert(T.noPdf);
          return;
        }
        const [P, S] = order();
        drawPosterPdf(lib, {
          P,
          S,
          sel: cur.codes,
          name: curName(),
          date: today(),
          footer: `${T.pdfTitle}: ${T.pdfCount(cur.codes.size)}`,
        }).save(fileName("pdf", "A3"));
      }
      render();
    </script>
  </body>
</html>
